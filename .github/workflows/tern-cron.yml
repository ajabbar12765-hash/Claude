# Runs Tern's automatic tasks every 15 minutes (Vercel's free plan only allows a daily cron).
# Set two repository secrets: TERN_URL (e.g. https://tern.example.com) and TERN_CRON_SECRET (same as CRON_SECRET in Vercel).
name: Tern tasks
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run due tasks
        env:
          TERN_URL: ${{ secrets.TERN_URL }}
          TERN_CRON_SECRET: ${{ secrets.TERN_CRON_SECRET }}
        run: |
          if [ -z "$TERN_URL" ]; then echo "TERN_URL not set, skipping"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $TERN_CRON_SECRET" "$TERN_URL/api/cron"
