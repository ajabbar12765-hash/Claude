<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline Video Grabber</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1216" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Video Grabber" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Offline Video Grabber</h1>
    <p class="subtitle">Paste YouTube links (one per line), fetch them, then download before you board. <span class="version">v3</span></p>

    <textarea id="urls" rows="4" placeholder="https://www.youtube.com/watch?v=...
https://youtu.be/..."></textarea>

    <div class="row">
      <label for="format">Quality</label>
      <select id="format">
        <option value="standard">Standard (no ffmpeg needed)</option>
        <option value="best">Best quality (needs ffmpeg)</option>
        <option value="audio">Audio only, MP3 (needs ffmpeg)</option>
      </select>
      <button id="addBtn">Fetch</button>
    </div>

    <p id="capNote" class="note"></p>
    <p id="status"></p>

    <ul id="list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
