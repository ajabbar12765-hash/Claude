<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0b0f14;
        color: #e6edf3;
        margin: 0;
        padding: 16px;
      }
      h1 { font-size: 16px; margin: 0 0 12px; }
      h2 { font-size: 12px; text-transform: uppercase; color: #8b98a5; margin: 16px 0 8px; }
      #status { font-size: 12px; color: #8b98a5; margin-top: 4px; }
      ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
      li { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      li.empty { color: #8b98a5; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .links { display: flex; gap: 12px; margin-top: 16px; }
      a { color: #3b82f6; font-size: 12px; }
      label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>ClickWarden</h1>
    <label><input type="checkbox" id="enabled" /> Protection enabled</label>
    <div id="status"></div>
    <h2>Recent activity</h2>
    <ul id="activity"></ul>
    <div class="links">
      <a id="dashboard" href="#" target="_blank">Open dashboard</a>
      <a href="options.html" id="settings" target="_blank">Settings</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
