<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClickWarden — link blocked</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0b0f14;
        color: #e6edf3;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        max-width: 480px;
        padding: 32px;
        border: 1px solid #dc2626;
        border-radius: 12px;
        background: #131a22;
        text-align: center;
      }
      h1 { font-size: 20px; margin-top: 0; }
      #url { font-family: monospace; word-break: break-all; color: #8b98a5; font-size: 13px; }
      #detail { font-size: 14px; color: #cbd5e1; }
      .actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
      button, a {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
      }
      #back { background: #3b82f6; color: white; }
      #proceed { background: transparent; color: #8b98a5; border: 1px solid #223140; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">This link looks dangerous</h1>
      <p id="url"></p>
      <p id="detail"></p>
      <div class="actions">
        <button id="back">Go back</button>
        <a id="proceed" href="#">Open it anyway</a>
      </div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
