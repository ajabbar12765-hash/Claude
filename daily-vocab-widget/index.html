<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Word of the Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
background:#05060a;color:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.scroller{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.scroller::-webkit-scrollbar{display:none}
.scroller{scrollbar-width:none}
/* fixed chrome */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
padding:calc(14px + env(safe-area-inset-top)) 20px 12px;pointer-events:none}
.wm{display:flex;align-items:center;gap:9px}
.wm img{width:26px;height:26px;border-radius:7px}
.wm b{font-size:15px;font-weight:700;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#b9a9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#cbd0e0;
border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.04);backdrop-filter:blur(6px)}
/* sections */
.sec{height:100dvh;scroll-snap-align:start;position:relative;display:grid;place-items:center;overflow:hidden;padding:0 22px}
.glow{position:absolute;inset:0;z-index:0}
.glow::before{content:"";position:absolute;left:50%;top:46%;width:120vmax;height:120vmax;transform:translate(-50%,-50%);
border-radius:50%;filter:blur(30px);opacity:.55;animation:breathe 9s ease-in-out infinite}
.s1 .glow::before{background:radial-gradient(circle at center,rgba(109,92,240,.9),rgba(109,92,240,0) 55%)}
.s2 .glow::before{background:radial-gradient(circle at center,rgba(34,211,238,.75),rgba(34,211,238,0) 55%)}
.s3 .glow::before{background:radial-gradient(circle at center,rgba(245,180,85,.72),rgba(245,180,85,0) 55%)}
.s4 .glow::before{background:radial-gradient(circle at center,rgba(224,90,158,.78),rgba(224,90,158,0) 55%)}
.s5 .glow::before{background:radial-gradient(circle at center,rgba(167,139,250,.85),rgba(167,139,250,0) 55%)}
.vignette{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(0,0,0,.55) 100%)}
.content{position:relative;z-index:3;text-align:center;max-width:820px;width:100%;
opacity:0;transform:translateY(34px) scale(.965);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.content.in{opacity:1;transform:none}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-bottom:18px}
.hero-word{white-space:nowrap;font-size:clamp(58px,19vw,180px);font-weight:800;letter-spacing:-.035em;line-height:.92;
background:linear-gradient(180deg,#ffffff 30%,#cfc6ff);-webkit-background-clip:text;background-clip:text;color:transparent;
animation:floaty 6.5s ease-in-out infinite;will-change:transform;filter:drop-shadow(0 18px 60px rgba(124,108,255,.5))}
.sub{margin-top:22px;font-size:clamp(15px,4.4vw,20px);color:rgba(255,255,255,.72);font-style:italic}
.sub .pos{font-style:normal;font-weight:700;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;margin-left:8px}
.label{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:20px}
.s2 .label{color:#7fe9f6}.s3 .label{color:#ffce8a}.s4 .label{color:#f5a3cb}.s5 .label{color:#c9b8ff}
.big{font-size:clamp(30px,7.4vw,54px);font-weight:700;line-height:1.16;letter-spacing:-.01em}
.quote{font-size:clamp(26px,6.6vw,46px);font-weight:600;font-style:italic;line-height:1.28;color:#f2eef9}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.chip{font-size:clamp(15px,4.6vw,22px);font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.24);
background:rgba(255,255,255,.06);border-radius:999px;padding:9px 20px;backdrop-filter:blur(4px)}
.cue{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));z-index:3;text-align:center;
color:rgba(255,255,255,.5);font-size:12px;letter-spacing:.12em;text-transform:uppercase;animation:bob 1.8s ease-in-out infinite}
.open{display:inline-block;margin-top:34px;font-size:15px;font-weight:700;color:#0a0a12;background:#fff;
border-radius:999px;padding:13px 26px;text-decoration:none;box-shadow:0 10px 30px rgba(255,255,255,.18)}
@keyframes floaty{0%,100%{transform:translateY(0) rotateX(0) rotateZ(0)}50%{transform:translateY(-14px) rotateX(6deg) rotateZ(-.6deg)}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-52%) scale(1.12);opacity:.62}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="wm"><img src="icon-192.png" alt=""><b>Daily&nbsp;Vocab</b></div><div class="pill" id="datepill">Today</div></div>
<div class="scroller" id="scroller">
  <section class="sec s1"><div class="glow"></div><div class="vignette"></div>
    <div class="content"><div class="eyebrow">Word of the day</div>
      <div class="hero-word" id="word">&nbsp;</div>
      <div class="sub"><span id="ipa"></span></div>
    </div>
    <div class="cue">Scroll ↓</div>
  </section>
  <section class="sec s2"><div class="glow"></div><div class="vignette"></div>
    <div class="content"><div class="label">Meaning</div><div class="big" id="def"></div></div>
  </section>
  <section class="sec s3" id="secSimple"><div class="glow"></div><div class="vignette"></div>
    <div class="content"><div class="label">In plain words</div><div class="big" id="simple"></div></div>
  </section>
  <section class="sec s4"><div class="glow"></div><div class="vignette"></div>
    <div class="content"><div class="label">In a sentence</div><div class="quote" id="ex"></div></div>
  </section>
  <section class="sec s5"><div class="glow"></div><div class="vignette"></div>
    <div class="content"><div class="label">Say it. Use it.</div><div class="chips" id="syn"></div>
      <a class="open" id="openApp" href="#">Open Daily Vocab</a></div>
  </section>
</div>
<script>
// Daily Vocab — curated list of "everyday advanced English" words.
// Sophisticated but genuinely usable words for professional and general communication.
// Each entry: word, ipa (pronunciation), pos (part of speech), definition,
// simple (plain-English explanation), example, synonyms[], tip (a memory hook).
window.WORDS = [
  { word: "ubiquitous", ipa: "/yoo-BIK-wih-tus/", pos: "adjective", definition: "Present, appearing, or found everywhere.", simple: "It's everywhere — you see it no matter where you look.", example: "Smartphones have become ubiquitous in modern life.", synonyms: ["omnipresent", "pervasive", "universal"], tip: "Think 'you-be-quick' to spot it — it's already everywhere you look." },
  { word: "pragmatic", ipa: "/prag-MAT-ik/", pos: "adjective", definition: "Dealing with things sensibly and realistically rather than idealistically.", simple: "Practical — you focus on what actually works, not on what sounds perfect.", example: "She took a pragmatic approach and fixed what could actually be fixed.", synonyms: ["practical", "realistic", "sensible"], tip: "A pragmatist cares about what works, not what sounds nice." },
  { word: "candid", ipa: "/KAN-did/", pos: "adjective", definition: "Truthful and straightforward; frank.", simple: "Honest and open — you say what you really think.", example: "I appreciate your candid feedback on the draft.", synonyms: ["frank", "honest", "forthright"], tip: "A 'candid camera' catches you being your unfiltered self." },
  { word: "meticulous", ipa: "/muh-TIK-yuh-lus/", pos: "adjective", definition: "Showing great attention to detail; very careful and precise.", simple: "Super careful — you check every little detail.", example: "He kept meticulous records of every transaction.", synonyms: ["thorough", "scrupulous", "painstaking"], tip: "Meticulous people 'tick' every box." },
  { word: "resilient", ipa: "/rih-ZIL-yunt/", pos: "adjective", definition: "Able to recover quickly from difficulties; tough.", simple: "You bounce back fast after something bad happens.", example: "The economy proved surprisingly resilient after the shock.", synonyms: ["tough", "hardy", "buoyant"], tip: "A resilient band snaps back to shape." },
  { word: "nuance", ipa: "/NOO-ahns/", pos: "noun", definition: "A subtle difference in meaning, expression, or tone.", simple: "A small, subtle detail that changes the meaning slightly.", example: "The translation missed the nuance of the original joke.", synonyms: ["subtlety", "shade", "gradation"], tip: "Nuance is the small 'new' detail others miss." },
  { word: "advocate", ipa: "/AD-vuh-kayt/", pos: "verb", definition: "To publicly recommend or support a cause or policy.", simple: "To speak up in support of something you believe in.", example: "She advocates for cleaner public transport.", synonyms: ["champion", "endorse", "promote"], tip: "An advocate adds their voice — 'ad-vocate'." },
  { word: "ambivalent", ipa: "/am-BIV-uh-lunt/", pos: "adjective", definition: "Having mixed or contradictory feelings about something.", simple: "You feel two ways about it at once — part yes, part no.", example: "He felt ambivalent about the promotion — flattered but anxious.", synonyms: ["conflicted", "torn", "undecided"], tip: "'Ambi' means both — you feel both ways at once." },
  { word: "concise", ipa: "/kun-SYSE/", pos: "adjective", definition: "Giving a lot of information clearly in a few words; brief but comprehensive.", simple: "Short and to the point, with no wasted words.", example: "Keep the summary concise — one paragraph at most.", synonyms: ["succinct", "terse", "pithy"], tip: "Concise cuts the excess — like a precise incision." },
  { word: "diligent", ipa: "/DIL-ih-junt/", pos: "adjective", definition: "Showing careful and persistent effort in work.", simple: "Hard-working and steady — you keep at it carefully.", example: "Her diligent research paid off in the final report.", synonyms: ["hardworking", "assiduous", "conscientious"], tip: "Diligent people 'dig' in until it's done." },
  { word: "eloquent", ipa: "/EL-uh-kwunt/", pos: "adjective", definition: "Fluent and persuasive in speaking or writing.", simple: "You speak or write so well that people are moved and convinced.", example: "The senator gave an eloquent defense of the bill.", synonyms: ["articulate", "expressive", "silver-tongued"], tip: "Eloquent speech flows like a smooth current." },
  { word: "tenacious", ipa: "/tuh-NAY-shus/", pos: "adjective", definition: "Holding firmly to a goal or opinion; persistent.", simple: "You don't give up — you hold on and keep going.", example: "Her tenacious pursuit of the truth impressed everyone.", synonyms: ["persistent", "dogged", "determined"], tip: "Tenacious grips like ten hands that won't let go." },
  { word: "prudent", ipa: "/PROO-dunt/", pos: "adjective", definition: "Acting with care and thought for the future; wise.", simple: "Careful and sensible — you think ahead before acting.", example: "It's prudent to keep three months of savings.", synonyms: ["cautious", "judicious", "sensible"], tip: "A prudent person prunes risk before it grows." },
  { word: "articulate", ipa: "/ar-TIK-yuh-lut/", pos: "adjective", definition: "Able to express thoughts clearly and effectively.", simple: "Good at putting your thoughts into clear words.", example: "She's remarkably articulate for someone so nervous.", synonyms: ["fluent", "coherent", "well-spoken"], tip: "Articulate = each idea joined clearly, like joints (articulations)." },
  { word: "innate", ipa: "/ih-NAYT/", pos: "adjective", definition: "Existing from birth; inborn and natural.", simple: "Something you're born with, not something you learned.", example: "He has an innate talent for languages.", synonyms: ["inborn", "inherent", "natural"], tip: "Innate is what you're born (nate) with." },
  { word: "scrutinize", ipa: "/SKROO-tuh-nyze/", pos: "verb", definition: "To examine or inspect closely and thoroughly.", simple: "To look at something very closely and carefully.", example: "Auditors scrutinized every line of the budget.", synonyms: ["examine", "inspect", "pore over"], tip: "To scrutinize is to 'screw in' your gaze." },
  { word: "profound", ipa: "/pruh-FOWND/", pos: "adjective", definition: "Very great, intense, or deeply felt; showing deep insight.", simple: "Very deep and powerful — it goes far beyond the surface.", example: "Her mentor had a profound effect on her career.", synonyms: ["deep", "intense", "far-reaching"], tip: "Profound goes as deep as a 'found' well." },
  { word: "versatile", ipa: "/VUR-suh-tul/", pos: "adjective", definition: "Able to adapt to many different functions or activities.", simple: "Good at lots of different things; can handle many roles.", example: "A versatile employee who can handle sales and support.", synonyms: ["adaptable", "flexible", "all-round"], tip: "Versatile can 'versa' — switch and reverse into many roles." },
  { word: "coherent", ipa: "/koh-HEER-unt/", pos: "adjective", definition: "Logical and consistent; clearly connected.", simple: "It makes sense and the parts fit together clearly.", example: "Try to give a coherent argument, not scattered points.", synonyms: ["logical", "consistent", "orderly"], tip: "Coherent parts cohere — they stick together sensibly." },
  { word: "gregarious", ipa: "/gruh-GAIR-ee-us/", pos: "adjective", definition: "Fond of company; sociable.", simple: "You love being around people and enjoy company.", example: "His gregarious nature made him the heart of every gathering.", synonyms: ["sociable", "outgoing", "convivial"], tip: "A gregarious person loves the 'gregation' — the crowd." },
  { word: "astute", ipa: "/uh-STOOT/", pos: "adjective", definition: "Having sharp judgment; shrewd and perceptive.", simple: "Sharp and clever — you quickly notice what's really going on.", example: "An astute investor who spotted the trend early.", synonyms: ["shrewd", "perceptive", "canny"], tip: "Astute minds are 'a-tuned' to what others miss." },
  { word: "empathy", ipa: "/EM-puh-thee/", pos: "noun", definition: "The ability to understand and share another's feelings.", simple: "Being able to feel and understand what someone else feels.", example: "Good managers lead with empathy, not just authority.", synonyms: ["compassion", "understanding", "sensitivity"], tip: "Empathy puts you 'in' another's path (em-pathy)." },
  { word: "impeccable", ipa: "/im-PEK-uh-bul/", pos: "adjective", definition: "In accordance with the highest standards; flawless.", simple: "Perfect — without a single fault or mistake.", example: "Her timing was impeccable.", synonyms: ["flawless", "faultless", "immaculate"], tip: "Impeccable has no 'peck' of a flaw." },
  { word: "reciprocate", ipa: "/rih-SIP-ruh-kayt/", pos: "verb", definition: "To respond to an action or feeling in kind; return the favor.", simple: "To give back the same kindness or favor you received.", example: "They helped us move, so we reciprocated the next weekend.", synonyms: ["return", "repay", "requite"], tip: "Reciprocate = give back what you 'received', re-cycled." },
  { word: "salient", ipa: "/SAY-lee-unt/", pos: "adjective", definition: "Most noticeable or important; standing out.", simple: "The most important part — the bit that stands out.", example: "Let's focus on the salient points and skip the details.", synonyms: ["prominent", "key", "notable"], tip: "A salient fact 'sails' out to grab your attention." },
  { word: "cordial", ipa: "/KOR-jul/", pos: "adjective", definition: "Warm and friendly in manner.", simple: "Warm and friendly toward someone.", example: "They kept a cordial relationship despite the rivalry.", synonyms: ["warm", "genial", "amiable"], tip: "Cordial comes from the heart (cor) — warm and sincere." },
  { word: "lucid", ipa: "/LOO-sid/", pos: "adjective", definition: "Clear and easy to understand; thinking clearly.", simple: "Clear and easy to follow.", example: "She gave a lucid explanation of a complex topic.", synonyms: ["clear", "coherent", "intelligible"], tip: "Lucid is lit up — like 'lucid' light, easy to see." },
  { word: "amiable", ipa: "/AY-mee-uh-bul/", pos: "adjective", definition: "Having a friendly and pleasant manner.", simple: "Nice and friendly — easy to like.", example: "Our new neighbor is genuinely amiable.", synonyms: ["friendly", "affable", "good-natured"], tip: "Amiable people are easy to be 'ami' (friend) with." },
  { word: "compelling", ipa: "/kum-PEL-ing/", pos: "adjective", definition: "Powerfully convincing or captivating.", simple: "So convincing or interesting that you can't ignore it.", example: "The lawyer made a compelling case to the jury.", synonyms: ["convincing", "persuasive", "gripping"], tip: "Compelling arguments compel — they push you to agree." },
  { word: "diplomatic", ipa: "/dip-luh-MAT-ik/", pos: "adjective", definition: "Skilled at handling situations tactfully.", simple: "Good at saying things carefully so nobody gets upset.", example: "He gave a diplomatic answer that offended no one.", synonyms: ["tactful", "sensitive", "politic"], tip: "A diplomat smooths things over with careful words." },
  { word: "endeavor", ipa: "/en-DEV-ur/", pos: "verb", definition: "To try hard to achieve something.", simple: "To try hard to do something.", example: "We endeavor to reply within 24 hours.", synonyms: ["strive", "attempt", "aim"], tip: "You endeavor by putting in your 'devoir' — your duty/effort." },
  { word: "feasible", ipa: "/FEE-zuh-bul/", pos: "adjective", definition: "Possible to do easily or conveniently.", simple: "Doable — it can actually be done.", example: "Is it feasible to finish this by Friday?", synonyms: ["viable", "workable", "practicable"], tip: "If it's feasible, you can 'feas' — actually do it." },
  { word: "genuine", ipa: "/JEN-yoo-in/", pos: "adjective", definition: "Truly what it is said to be; sincere and authentic.", simple: "Real and honest — not fake.", example: "Her concern felt completely genuine.", synonyms: ["authentic", "real", "sincere"], tip: "Genuine comes from the 'gene' — it's the real, original thing." },
  { word: "humble", ipa: "/HUM-bul/", pos: "adjective", definition: "Modest; not proud or arrogant.", simple: "Modest — you don't brag or act better than others.", example: "Despite his success, he stayed humble.", synonyms: ["modest", "unassuming", "down-to-earth"], tip: "Humble keeps you close to the humus — the ground." },
  { word: "intuitive", ipa: "/in-TOO-ih-tiv/", pos: "adjective", definition: "Understood or known instinctively, without conscious reasoning.", simple: "Easy to understand or feel without having to think hard.", example: "The app has an intuitive design anyone can use.", synonyms: ["instinctive", "natural", "innate"], tip: "Intuitive knowing comes from within — your 'gut'." },
  { word: "judicious", ipa: "/joo-DISH-us/", pos: "adjective", definition: "Having or showing good judgment.", simple: "Wise — you make smart, well-thought-out choices.", example: "A judicious use of the budget kept the project alive.", synonyms: ["wise", "prudent", "sensible"], tip: "Judicious decisions are like a good judge's — sound and fair." },
  { word: "leverage", ipa: "/LEV-ur-ij/", pos: "verb", definition: "To use something to maximum advantage.", simple: "To use what you have to get the most out of it.", example: "We can leverage our network to find candidates.", synonyms: ["exploit", "harness", "utilize"], tip: "Leverage uses a lever to move more with less." },
  { word: "mitigate", ipa: "/MIT-ih-gayt/", pos: "verb", definition: "To make less severe, serious, or painful.", simple: "To make a bad thing less bad.", example: "Insurance helps mitigate financial risk.", synonyms: ["alleviate", "reduce", "lessen"], tip: "Mitigate softens the blow — it makes trouble 'mild'." },
  { word: "novel", ipa: "/NOV-ul/", pos: "adjective", definition: "New, original, or unusual in an interesting way.", simple: "New and fresh — something not done before.", example: "They proposed a novel solution nobody had tried.", synonyms: ["new", "original", "innovative"], tip: "A novel idea is brand new — like a fresh 'novelty'." },
  { word: "objective", ipa: "/ub-JEK-tiv/", pos: "adjective", definition: "Not influenced by personal feelings; based on facts.", simple: "Fair and fact-based — not swayed by your feelings.", example: "Try to stay objective when reviewing your own work.", synonyms: ["impartial", "unbiased", "detached"], tip: "Objective looks at the object, not your feelings." },
  { word: "plausible", ipa: "/PLAW-zuh-bul/", pos: "adjective", definition: "Seeming reasonable or probable.", simple: "Believable — it sounds like it could be true.", example: "That's a plausible explanation, but let's verify it.", synonyms: ["credible", "believable", "reasonable"], tip: "A plausible story earns applause — it sounds right." },
  { word: "quintessential", ipa: "/kwin-tuh-SEN-shul/", pos: "adjective", definition: "Representing the most perfect example of a quality.", simple: "The perfect example of its kind.", example: "He's the quintessential gentleman.", synonyms: ["archetypal", "classic", "typical"], tip: "The quintessential thing is the pure 'essence' of its kind." },
  { word: "rapport", ipa: "/ra-POR/", pos: "noun", definition: "A close and harmonious relationship with mutual understanding.", simple: "A good, easy connection between people who 'get' each other.", example: "She quickly built a rapport with new clients.", synonyms: ["connection", "bond", "understanding"], tip: "Rapport is when you 'report' well to each other — smooth exchange." },
  { word: "sincere", ipa: "/sin-SEER/", pos: "adjective", definition: "Free from pretense; genuine and honest.", simple: "You really mean what you say — no pretending.", example: "Please accept my sincere apologies.", synonyms: ["genuine", "heartfelt", "earnest"], tip: "Sincere means 'without wax' — no covering up flaws." },
  { word: "transparent", ipa: "/trans-PAIR-unt/", pos: "adjective", definition: "Open and honest; easy to perceive or detect.", simple: "Open and honest — nothing is hidden.", example: "We aim to be transparent about our pricing.", synonyms: ["open", "candid", "clear"], tip: "Transparent lets you see right through — nothing hidden." },
  { word: "unprecedented", ipa: "/un-PRES-ih-den-tid/", pos: "adjective", definition: "Never done or known before.", simple: "Never happened before — totally new.", example: "The response was unprecedented in the company's history.", synonyms: ["unparalleled", "unheard-of", "novel"], tip: "Un-precedent-ed: no precedent has come before it." },
  { word: "viable", ipa: "/VY-uh-bul/", pos: "adjective", definition: "Capable of working successfully; feasible.", simple: "It can actually work.", example: "It's the only viable option we have left.", synonyms: ["workable", "feasible", "practical"], tip: "A viable plan has 'life' (vita) in it — it can survive." },
  { word: "wary", ipa: "/WAIR-ee/", pos: "adjective", definition: "Cautious about possible dangers or problems.", simple: "Careful and a little suspicious of possible trouble.", example: "Be wary of deals that seem too good to be true.", synonyms: ["cautious", "careful", "guarded"], tip: "Stay wary and you'll be 'aware' of the trap." },
  { word: "zealous", ipa: "/ZEL-us/", pos: "adjective", definition: "Filled with eager, passionate commitment.", simple: "Really eager and passionate about something.", example: "A zealous volunteer who never misses an event.", synonyms: ["passionate", "fervent", "ardent"], tip: "Zealous is full of zeal — burning enthusiasm." },
  { word: "affable", ipa: "/AF-uh-bul/", pos: "adjective", definition: "Friendly, good-natured, and easy to talk to.", simple: "Friendly and easy to chat with.", example: "The host was affable and put everyone at ease.", synonyms: ["genial", "amiable", "cordial"], tip: "Affable people are easy to 'talk' to (fable = speak)." },
  { word: "benevolent", ipa: "/buh-NEV-uh-lunt/", pos: "adjective", definition: "Well-meaning and kindly.", simple: "Kind and generous — you want good things for others.", example: "A benevolent donor funded the whole library.", synonyms: ["kind", "generous", "charitable"], tip: "Benevolent = 'wishing well' (bene = good, volent = wishing)." },
  { word: "cautious", ipa: "/KAW-shus/", pos: "adjective", definition: "Careful to avoid potential problems or dangers.", simple: "Careful — you avoid taking risks.", example: "He's cautious with money after the crash.", synonyms: ["careful", "prudent", "guarded"], tip: "Cautious people heed the 'caution' sign." },
  { word: "decisive", ipa: "/dih-SY-siv/", pos: "adjective", definition: "Settling an issue quickly and effectively; resolute.", simple: "You make firm decisions quickly, without dithering.", example: "Her decisive leadership saved the deal.", synonyms: ["resolute", "firm", "determined"], tip: "Decisive people decide — no endless dithering." },
