<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jarvis</title>
  <meta name="description" content="Your personal voice assistant and email manager.">
  <meta name="theme-color" content="#05080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============ Connect screen ============ -->
  <section id="setup" class="screen setup" hidden>
    <div class="setup-card">
      <div class="mini-orb"><span></span></div>
      <h1>Connect Jarvis</h1>
      <p class="muted" id="setupMsg">Paste the link that the <b>appLink</b> function printed. You can also fill in both boxes yourself.</p>
      <label>Connect link
        <input id="setupLink" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…/#u=…&amp;s=…">
      </label>
      <div class="or">or</div>
      <label>Web app URL
        <input id="setupUrl" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      </label>
      <label>Secret
        <input id="setupSecret" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="from the setup log">
      </label>
      <button id="setupGo" class="btn primary wide">Connect</button>
      <p class="hint" id="installHint" hidden>Tip: in Safari, tap <b>Share → Add to Home Screen</b> so Jarvis opens like a real app.</p>
    </div>
  </section>

  <!-- ============ Main app ============ -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="dot" id="statusDot"></span> JARVIS</div>
      <div class="top-actions">
        <button id="handsFreeBtn" class="pill" aria-pressed="false" title="Always listen for 'Jarvis'">Hands-free off</button>
        <button id="settingsBtn" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Jarvis tab -->
    <main id="tab-jarvis" class="tab active">
      <div class="feed" id="feed"></div>
      <div class="console">
        <button id="orb" class="orb" aria-label="Talk to Jarvis">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
        </button>
        <div class="orb-label" id="orbLabel">Tap to talk</div>
        <form id="chatForm" class="chatbar">
          <input id="chatInput" type="text" placeholder="Type or say something…" autocomplete="off" enterkeyhint="send">
          <button class="btn primary" type="submit">Send</button>
        </form>
      </div>
    </main>

    <!-- Inbox tab -->
    <main id="tab-inbox" class="tab">
      <div class="inbox-head">
        <div>
          <h2>Inbox</h2>
          <div class="muted small" id="inboxStats">Loading…</div>
        </div>
        <button id="organizeBtn" class="btn primary">Organize now</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="list" id="mailList"></div>
    </main>

    <!-- Activity tab -->
    <main id="tab-activity" class="tab">
      <h2>Activity</h2>
      <h3>Waiting for replies</h3>
      <div id="watchList" class="list compact"></div>
      <h3>Scheduled</h3>
      <div id="queueList" class="list compact"></div>
      <h3>Recent</h3>
      <div id="eventList" class="list compact"></div>
    </main>

    <nav class="tabbar">
      <button data-tab="jarvis" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9" fill="none"/></svg>Jarvis</button>
      <button data-tab="inbox"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z" fill="none"/><path d="M3 7l9 6 9-6" fill="none"/></svg>Inbox<span class="badge" id="inboxBadge" hidden></span></button>
      <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4" fill="none"/></svg>Activity</button>
    </nav>
  </div>

  <!-- Email sheet -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <button class="icon-btn" id="sheetClose" aria-label="Close">✕</button>
        <div class="sheet-title" id="sheetTitle"></div>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-actions" id="sheetActions"></div>
    </div>
  </div>

  <!-- Settings sheet -->
  <div id="settings" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <button class="icon-btn" id="settingsClose" aria-label="Close">✕</button>
        <div class="sheet-title">Settings</div>
      </div>
      <div class="sheet-body settings-body">
        <label class="row">Speak replies out loud <input type="checkbox" id="setVoiceOn"></label>
        <label>Voice
          <select id="setVoice"></select>
        </label>
        <label>Speed <input type="range" id="setRate" min="0.8" max="1.4" step="0.05"></label>
        <button class="btn" id="testVoice">Test voice</button>
        <label class="row">Start in hands-free mode <input type="checkbox" id="setHandsFree"></label>
        <hr>
        <div class="muted small" id="connInfo"></div>
        <button class="btn danger" id="disconnect">Disconnect</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
