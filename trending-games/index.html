<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1220" />
<meta name="description" content="Play Zone — a collection of fast, fun, timer-based trending games. Works fully offline." />
<title>Play Zone — Trending Games</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back to menu" hidden>&#8592;</button>
    <h1 id="pageTitle" class="brand">🎮 Play Zone</h1>
    <span id="offlineBadge" class="offline-badge" hidden>Offline</span>
  </header>

  <main id="home" class="home">
    <p class="tagline">Fast, fun, trending mini-games. No sign-up, no ads, no internet required.</p>
    <div id="gameGrid" class="grid"></div>
  </main>

  <main id="gameView" class="game-view" hidden>
    <div id="gameRoot" class="game-root"></div>
  </main>

  <footer class="foot">
    <span>Your scores are saved on this device.</span>
  </footer>
</div>

<script defer src="app.js"></script>
<script defer src="games/reaction.js"></script>
<script defer src="games/typing.js"></script>
<script defer src="games/2048.js"></script>
<script defer src="games/snake.js"></script>
<script defer src="games/memory.js"></script>
<script defer src="games/whackamole.js"></script>
<script defer src="games/simon.js"></script>
<script defer src="games/minesweeper.js"></script>
<script defer src="games/tictactoe.js"></script>
<script defer src="games/rps.js"></script>
</body>
</html>
